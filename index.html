<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11161f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Colony survival strategy for phone and browser. Build, power and fortify a colony and survive the swarms.">
  <title>Billions — Colony Survival</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="top">
      <div id="res-bar"></div>
      <div id="top-right">
        <div id="clock"><span id="day"></span><div id="daybar"><div></div></div></div>
        <div id="speed"></div>
        <button id="btn-menu" class="ib" title="Menu (Esc)"><span class="ico" data-icon="menu">☰</span></button>
      </div>
      <div id="wave-bar"></div>
    </div>
    <div id="res-detail" class="panel hidden"></div>
    <div id="toasts"></div>
    <div id="left-rail">
      <button id="btn-select" class="rail" title="Box select (touch)"><span class="ico" data-icon="select">⬚</span><small>Select</small></button>
      <button id="btn-army" class="rail" title="Select all army (A)"><span class="ico" data-icon="army">⚔</span><small>Army</small></button>
      <button id="btn-home" class="rail" title="Command Center (H)"><span class="ico" data-icon="base">⌂</span><small>Base</small></button>
      <button id="btn-alert" class="rail" title="Last alert (Space)"><span class="ico" data-icon="alert">!</span><small>Alert</small></button>
      <div id="groups"></div>
    </div>
    <div id="right-rail">
      <canvas id="minimap" width="160" height="160"></canvas>
      <button id="btn-grid" class="rail small" title="Show energy grid (G)"><span class="ico" data-icon="grid">⚡</span><small>Grid</small></button>
    </div>
    <div id="context" class="panel hidden"></div>
    <div id="place-bar" class="panel hidden"></div>
    <div id="bottom">
      <div id="tabs"></div>
      <div id="tray"></div>
    </div>
  </div>

  <!-- Full-screen overlays -->
  <div id="overlay">
    <section id="scr-loading" class="screen">
      <h1 class="logo">BILLIONS</h1>
      <div class="progress"><div id="load-bar"></div></div>
      <p class="muted" id="load-text">Loading…</p>
    </section>
    <section id="scr-title" class="screen hidden">
      <h1 class="logo">BILLIONS</h1>
      <p class="sub">Build. Power. Fortify. Survive the swarm.</p>
      <div class="stack">
        <button id="t-continue" class="big primary hidden">Continue</button>
        <button id="t-survival" class="big">Survival</button>
        <button id="t-challenge" class="big">Weekly Challenge</button>
        <button id="t-campaign" class="big">Campaign</button>
        <button id="t-scores" class="big">High Scores</button>
        <button id="t-help" class="big">How to Play</button>
        <button id="t-settings" class="big">Settings</button>
      </div>
      <p class="tiny">Works offline. On a phone: Share → Add to Home Screen.</p>
    </section>
    <section id="scr-setup" class="screen hidden">
      <h2>Survival</h2>
      <div id="setup-body"></div>
      <div class="row-btns"><button id="setup-back" class="big">Back</button><button id="setup-go" class="big primary">Start</button></div>
    </section>
    <section id="scr-generic" class="screen hidden">
      <h2 id="gen-title"></h2>
      <div id="gen-body" class="scroll"></div>
      <div id="gen-btns" class="row-btns"></div>
    </section>
  </div>

  <div id="modal" class="hidden"><div class="modal-card"><div id="modal-body"></div><div id="modal-btns" class="row-btns"></div></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
